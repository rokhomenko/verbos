services:
  postgres:
    image: postgres:17-alpine
    container_name: verbos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: verbos
    ports:
      - "5432:5432"
    volumes:
      - verbos-pg-data:/var/lib/postgresql/data

volumes:
  verbos-pg-data:
